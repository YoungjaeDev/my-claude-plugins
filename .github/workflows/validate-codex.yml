name: validate-codex

# Catch README/AGENTS doc-consistency drift, silent skill-contract violations,
# and GNU-only shell regressions at PR time, even if a contributor skipped the
# local .githooks pre-commit hook.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # README.md / AGENTS.md plugin name-set + count strings must match the
      # marketplace registry — drift the version files alone cannot catch.
      - run: node scripts/check-doc-consistency.mjs
      # Progressive-disclosure smell detector (skill docs > ~500 lines, deep bundled
      # references). INFORMATIONAL ONLY — always exits 0, never blocks the run.
      - run: node scripts/check-skill-prose.mjs || true
      # cr-fix's CLI-fallback / CR-state / rate-limit paths only run after the
      # primary path fails, so nothing exercised them until they broke in
      # production (issues #105, #110). Fixture-driven, no network, sub-second.
      - run: bash plugins/dev/skills/cr-fix/tests/run-tests.sh
      # convene ships no scripts -- its runner contracts are shell inside SKILL.md,
      # so nothing executes them. A dropped `< /dev/null` on the agy call blocks
      # that seat forever (--print-timeout does not bound it), and parsing codex
      # stdout instead of its -o file reads hook lines as the answer. Neither is
      # a GNU-only construct, so check-shell-portability cannot see them.
      - run: bash plugins/council/skills/convene/tests/run-tests.sh
      # code_review.md P1 forbids unguarded GNU-only shell constructs, and until
      # now nothing enforced it -- md5sum shipped in translator and collapsed every
      # downloaded image to one filename on macOS (issue #172). Flags a construct
      # only when no fallback, capability probe, or `# portability-ok:` sits near it.
      - run: node scripts/check-shell-portability.mjs
      # Both directions: constructs that must be flagged, and correct fallbacks
      # that must not be. The second half is what keeps the guard usable -- one
      # false positive on `stat -c … || stat -f …` and it gets switched off.
      - run: node scripts/check-shell-portability.test.mjs
      # Silent-failure checks on skill frontmatter/bodies: description over the
      # Codex 1024-char skip threshold, unquoted `: ` collapsing the YAML, bare
      # ${CLAUDE_PLUGIN_ROOT} in a shell block with no resolver, non-kebab name,
      # frontmatter not at byte 0. Every one of them loads fine under Claude Code, so
      # review never sees them. The step runs its own RED/GREEN fixtures before the
      # scan — a guard that silently stopped detecting fails instead of passing.
      - run: node scripts/check-skill-contract.mjs

  # The BSD fallbacks the suite is full of can only be proven on a BSD userland.
  # Without this leg every `stat -c || stat -f` and `date -d || date -j` branch is
  # asserted on the GNU half alone and the other half rots unexecuted (issue #182).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Printed directly rather than through `echo "$(...)"`. Command substitution
      # inside echo discards the inner status -- echo succeeds either way -- which
      # is the "종료 상태가 사라지는 자리" P1 this repo added in #183, and a workflow
      # that violates its own rule is a bad exemplar. The step's shell is `bash -e`,
      # so a genuinely missing bash now fails here instead of printing a blank line.
      # The loop keeps its `|| echo '(absent)'`: absence is the answer it is asking.
      - name: runner userland (informational)
        run: |
          # The step shell is `bash -e`, which does NOT set pipefail: a failing
          # `/bin/bash --version` was masked by `head`'s success and the step
          # still passed -- the same false green this block was rewritten to
          # remove, one layer down. Verified: `bash -e -c '/missing/bash
          # --version | head -1; echo survived'` exits 0.
          set -o pipefail
          echo "bash on PATH:"
          which -a bash
          echo "PATH bash:"
          bash --version | head -1
          echo "/bin/bash:"
          /bin/bash --version | head -1
          for t in sed grep date stat jq md5sum timeout gsed gdate gstat; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo '(absent)')"
          done
      # `env -i PATH=/usr/bin:/bin` is the obvious way to force stock userland and
      # it is WRONG here: on macOS jq lives under Homebrew, not /usr/bin, and the
      # suite is built on jq -- the run would die on a missing tool rather than
      # exercise anything. Keep the full PATH so jq resolves, and assert instead
      # that the tools whose GNU/BSD split this leg exists to cover really are the
      # BSD ones. GNU builds answer --version; the BSD ones reject it, so a
      # SUCCEEDING --version means Homebrew coreutils shadowed the system tool and
      # this leg would be re-testing the GNU half the ubuntu job already covers.
      # Failing loudly beats a green run that proved nothing.
      - name: assert stock BSD userland
        run: |
          fail=0
          for t in sed date stat; do
            # Presence first. `"$t" --version` failing means EITHER "BSD rejects
            # the flag" OR "the tool is not installed", and folding those together
            # would report an absent tool as a healthy BSD one -- the exact
            # could-not-look-reads-as-nothing-wrong bug this step exists to prevent.
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::$t is not on PATH — cannot tell whether this runner has a BSD userland"
              fail=1
            elif "$t" --version >/dev/null 2>&1; then
              echo "::error::$t on PATH is a GNU build ($(command -v "$t")) — Homebrew coreutils shadow the BSD tool, so this leg is not testing BSD"
              fail=1
            else
              echo "ok: $t is the BSD build ($(command -v "$t"))"
            fi
          done
          command -v jq >/dev/null 2>&1 || { echo "::error::jq is absent; the suite cannot run"; fail=1; }
          exit "$fail"
      # /bin/bash explicitly, never `bash`: the runner image may carry Homebrew's
      # bash 5 earlier on PATH, and a real Mac user's /bin/bash is 3.2. Running the
      # suite under 5 would let a bash-4-only construct pass here and break for them.
      - name: cr-fix suite under /bin/bash (3.2) + BSD tools
        run: /bin/bash plugins/dev/skills/cr-fix/tests/run-tests.sh
      - name: convene suite under /bin/bash (3.2) + BSD tools
        run: /bin/bash plugins/council/skills/convene/tests/run-tests.sh

  # commandWindows is interpreted by PowerShell, not cmd.exe. This leg executes the
  # descriptor's real command strings through powershell.exe and Git Bash so quoting,
  # executable invocation, and PLUGIN_ROOT expansion cannot regress silently.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: execute bundled Codex hooks through PowerShell
        run: node scripts/windows-codex-hooks.test.mjs
