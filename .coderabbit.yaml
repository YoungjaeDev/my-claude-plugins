# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit config for the my-claude-plugins marketplace (Pro+ tier).
#
# Warning-mode gates only: every pre_merge_check below is `mode: warning`, never
# `error`. CodeRabbit's review sandbox has no Node, so it cannot run our check
# scripts; a hard `error` gate would false-block on checks it cannot execute. The
# authoritative hard gates stay in GitHub Actions (.github/workflows/validate-codex.yml)
# and .githooks/pre-commit. These warnings only surface advisories in the Walkthrough.
#
# Evaluate-only decision (Issue #121): CodeRabbit's autofix and custom review
# recipes overlap the /github-dev:cr-fix apply loop, which already judges and
# applies each finding with repo-specific autonomy. Enabling CR-side autofix would
# double-drive edits against the same diff. Decision: NOT adopted; no `cr-tune`
# skill (YAGNI). Recorded here as a deliberate choice, not an oversight.
reviews:
  auto_review:
    # Explicit 0 = DISABLED. Omitting this key does NOT disable it — CodeRabbit
    # defaults to 5 (pause auto-review after 5 reviewed commits since the last
    # pause; "Set to 0 to disable" per docs.coderabbit.ai/reference/configuration).
    # Auto-pause conflicts with this repo's core workflow: /github-dev:cr-fix pushes
    # one fix commit per iteration and relies on CodeRabbit auto-reviewing each push
    # to detect convergence; a pause (needing a manual `@coderabbitai review`) emits
    # no rate_limited signal, so cr-fix's Step 6 poll would time out with no review.
    # Review-consumption is instead bounded by cr-fix's MAX_ITER cap + minor-soft-stop
    # and the ignore_title_keywords / path_instructions levers below.
    auto_pause_after_reviewed_commits: 0
    # Skip review entirely while a PR is still work-in-progress.
    ignore_title_keywords:
      - WIP
  path_instructions:
    - path: "plugins/**"
      instructions: >-
        This is a Claude Code plugin marketplace also consumed natively by Codex
        (Codex reads the same `.claude-plugin/` manifests via its manifest
        fallback). Skill frontmatter rules: each skill's SKILL.md `description`
        must stay under 1024 characters (Codex silently skips longer ones) and
        must be quoted if it contains a colon-space (": "), or YAML parses it as
        a nested mapping and the skill fails to load. A version bump must update
        `plugins/<name>/.claude-plugin/plugin.json` and the matching
        `.claude-plugin/marketplace.json` entry together.
    - path: "scripts/*.mjs"
      instructions: >-
        These are repo consistency guards (doc-consistency, shell-portability,
        skill-contract, skill-prose). They must use Node 18+ built-ins only --
        flag any added runtime dependency (an `import`/`require` of a
        non-builtin package).
  pre_merge_checks:
    custom_checks:
      - name: "Plugin version triple-sync"
        mode: warning
        instructions: >-
          Advisory only (the hard gate is GitHub Actions; CodeRabbit cannot run our
          Node tooling). PASS if no file under `plugins/<name>/` changed, OR if the
          changed plugin's `version` is bumped identically in both
          `plugins/<name>/.claude-plugin/plugin.json` and its entry in
          `.claude-plugin/marketplace.json`, AND `metadata.version` in
          `.claude-plugin/marketplace.json` is also bumped. FAIL if a plugin file
          changed without all three updates in sync. Root docs (AGENTS.md, README.md,
          code_review.md, .claude/rules/*) are not plugin content and bump nothing.
      - name: "Skill description under 1024 chars"
        mode: warning
        instructions: >-
          Advisory only. FAIL if any skill `SKILL.md` `description` frontmatter field
          added or changed in this PR exceeds 1024 characters -- Codex silently
          skips such skills. Otherwise PASS.
      - name: "AGENTS.md rule-mirror presence"
        mode: warning
        instructions: >-
          Advisory only. `.claude/rules/*.md` is Claude-only; Codex reads
          `AGENTS.md`. FAIL if this PR adds or changes a cross-cutting behavioral rule
          in `.claude/rules/` without a corresponding mirror block in `AGENTS.md`.
          Path-scoped mechanical rules (e.g. `plugin-versioning.md`, loaded only when
          its target files are touched) are exempt. Otherwise PASS.
