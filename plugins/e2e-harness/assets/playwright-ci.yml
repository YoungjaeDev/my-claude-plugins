# Playwright E2E — gated CI workflow (template).
# Generated by e2e-harness:e2e-setup. Customize the placeholders, then commit as
# .github/workflows/e2e.yml
#
# Gating (avoid running the full suite on every push):
#   - `paths:` filter — only PRs that touch app/test code trigger this workflow.
#     NOTE: GitHub's native `paths:` filter is NOT compatible with the `labeled`
#     event — a label-only PR (no path change) would never trigger. So label-based
#     force-run is intentionally NOT combined with `paths:` here. If you want an
#     `e2e`-label override that runs even when no gated path changed, drop `paths:`
#     and detect changes at the job level with `dorny/paths-filter` instead.
#
# Action pins below are a recent, coherent set. Playwright's own docs currently
# disagree across pages (checkout@v5, setup-node@v5/@v6, upload-artifact@v4/@v5).
# Re-verify pins at https://playwright.dev/docs/ci-intro before relying on them.

name: E2E

# `gh pr comment` (failure step) posts an issue comment — needs `issues: write`.
# `contents: read` is for checkout.
permissions:
  contents: read
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # <-- Adjust to your app/test code. Keep narrow so unrelated PRs skip E2E.
      - "src/**"
      - "app/**"
      - "e2e/**"
      - "tests/**"
      - "playwright.config.*"
      - ".github/workflows/e2e.yml"
  workflow_dispatch: {}

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Gating is handled by the trigger above (`paths:` for PRs + manual dispatch),
    # so no job-level `if:` is needed.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        # E2E-only env flags (e.g. fixed BFF responses) go here.
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: npx playwright test

      - name: Upload HTML report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      # No official PR-comment step exists in Playwright's CI docs — this is custom.
      - name: Comment on PR (on failure)
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --body "$(cat <<EOF
          ### E2E failed

          The Playwright E2E suite failed on this PR.

          - Run: $RUN_URL
          - Download the \`playwright-report-${{ github.run_id }}\` artifact for the HTML report + traces.
          - Debug locally with the \`e2e-harness:e2e-debug\` skill (it fetches the trace and runs the healer).
          EOF
          )"
